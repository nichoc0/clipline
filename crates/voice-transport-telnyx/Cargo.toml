[package]
name = "voice-transport-telnyx"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Telnyx Media Streams transport (CarrierSession impl) for voice-gateway. Owns the WebSocket framing, base64 μ-law (de)coding, and Telnyx-specific JSON event protocol."

[dependencies]
voice-transport = { path = "../voice-transport" }
voice-protocols = { path = "../voice-protocols" }
voice-orchestrator = { path = "../voice-orchestrator" }
audio-utils = { path = "../audio-utils" }

axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true }
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
